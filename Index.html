<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Raymond Shop | 5-Star Experience</title>
  <style>
    :root {
      --bg: #0c090a;
      --card-bg: #151012;
      --raymond-red: #8B0000;
      --raymond-gradient: linear-gradient(135deg, #a81c1c 0%, #8B0000 60%, #500000 100%);
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #fef08a 0%, #d4af37 50%, #996515 100%);
      --text-main: #fcfcfd;
      --text-muted: #a39ea0;
      --border-color: rgba(212, 175, 55, 0.25);
      --chip-bg: #1f181a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 410px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 14px 35px rgba(0,0,0,0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Brand Header */
    .header {
      padding: 22px 16px 12px;
      text-align: center;
    }

    .brand-emblem {
      width: 64px;
      height: 64px;
      margin: 0 auto 10px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--raymond-gradient);
      box-shadow: 0 4px 15px rgba(139, 0, 0, 0.4);
    }

    .brand-emblem span {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
    }

    .brand-title {
      font-family: 'Georgia', serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 3px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #201518;
      border: 1px solid var(--border-color);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      margin-top: 8px;
      color: #e5e5ea;
    }

    .stars {
      color: #f59e0b;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* 3-Step Guide */
    .steps-bar {
      display: flex;
      justify-content: space-between;
      margin: 6px 16px 10px;
      background: #100b0d;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .step-num {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--gold-primary);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 800;
    }

    /* Category Controls */
    .controls {
      padding: 0 16px 6px;
    }

    .pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .pills::-webkit-scrollbar { display: none; }

    .pill {
      background: var(--chip-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #a8a29e;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: var(--raymond-gradient);
      color: #ffffff;
      border-color: var(--gold-primary);
      font-weight: 700;
    }

    .lang-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .unique-badge {
      font-size: 10px;
      color: #d4af37;
      font-weight: 600;
    }

    .segmented-control {
      display: flex;
      background: #0f0a0c;
      padding: 2px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: #78716c;
      font-size: 10.5px;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .seg-btn.active {
      background: #2a1f23;
      color: #fff;
    }

    /* Review Box */
    .review-wrapper {
      padding: 0 16px 14px;
    }

    .review-box {
      position: relative;
      background: #0d090b;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 44px 12px 14px;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .review-text {
      font-size: 13px;
      line-height: 1.5;
      color: #f5f5f4;
      font-weight: 500;
      outline: none;
    }

    .review-hint {
      margin-top: 5px;
      font-size: 9.5px;
      color: #78716c;
    }

    .refresh-btn {
      position: absolute;
      right: 10px;
      top: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #23191c;
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
    }

    /* CTA Button */
    .cta-btn {
      margin-top: 12px;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--gold-gradient);
      color: #0b0809;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3);
    }

    .cta-btn.copied {
      background: #10b981;
      color: #fff;
    }

    /* Footer Hub */
    .footer-nav {
      background: #100b0d;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      padding: 12px 8px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
    }

    .nav-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #1d1417;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
  </style>
</head>
<body>

    <!-- 3-Step Guide -->

    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="pills">
        <button class="pill active" onclick="setCategory(this, 'all')">✨ ALL EXPERIENCE</button>
        <button class="pill" onclick="setCategory(this, 'tailoring')">🧵 CUSTOM TAILORING</button>
        <button class="pill" onclick="setCategory(this, 'suiting')">👔 SUITS & FABRIC</button>

      <div class="lang-row">
        <span class="unique-badge">⚡ Instant Unique Review</span>
        <div class="segmented-control">
          <button class="seg-btn active" id="btn-en" onclick="setLang('en')">EN</button>
          <button class="seg-btn" id="btn-hi" onclick="setLang('hi')">HINGLISH</button>
        </div>
      </div>
    </div>

    <!-- Review Section -->
    <div class="review-wrapper">
      <div class="review-box">
        <div class="review-text" id="review-content" contenteditable="true" spellcheck="false">Loading review...</div>
        <p class="review-hint">✎ Tap text above to personalize if needed</p>
        <button class="refresh-btn" onclick="shuffleReview()" title="Next Review">⟳</button>
      </div>

      <button class="cta-btn" id="copy-btn" onclick="copyAndRedirect()">
        <span>📋</span> COPY & RATE 5-STAR
      </button>
    </div>

    <!-- Footer Action Hub -->
    <div class="footer-nav">
      <a href="https://maps.app.goo.gl/cDBaZ3pP6Av1aEYo9" class="nav-btn" target="_blank">
        <div class="nav-icon">📍</div>
        Store Map
      </a>
      <a href="tel:08069865380" class="nav-btn">
        <div class="nav-icon">📞</div>
        Call Store
      </a>
      <a href="https://south-tukoganj.myraymond.com" class="nav-btn" target="_blank">
        <div class="nav-icon">🌐</div>
        Website
      </a>
    </div>
  </div>

          ],

          ],

        suiting: {

          ],

          ],

            "Kapde ke weight aur season ke hisaab se sahi salah di."
          ],
          closers: [
            "Full satisfaction mila, fabric quality me koi mukabla nahi!",
            "Shaadi ke kapdo ke liye best showroom in TI Mall Indore."
          ]
        },
        service: {
          openers: [
            "Store ke staff ka behaviour aur hospitality bohot shandar rahi.",
            "TI Mall ke Raymond showroom me shopping karna bohot relaxing raha."
          ],
          details: [
            "Staff bohot humble hai aur customer ko poora time deta hai.",
            "Store neat, clean aur systematically organized hai."
          ],
          experience: [
            "Fast billing aur smooth service mili.",
            "Genuine suggestions dete hain bina kisi zabardasti ke."
          ],
          closers: [
            "10/10 customer satisfaction! Keep it up team Raymond.",
            "Shandar customer service ke liye poore 5 stars!"
          ]

      }
    };

    let activeCategory = 'all';
    let activeLang = 'en';
    const reviewRedirectUrl = "https://maps.app.goo.gl/cDBaZ3pP6Av1aEYo9";
    
    let recentReviews = [];

    function getCryptoRandomItem(arr) {
      if (!arr || arr.length === 0) return "";
      const randomBuffer = new Uint32Array(1);
      window.crypto.getRandomValues(randomBuffer);
      const randomIndex = randomBuffer[0] % arr.length;
      return arr[randomIndex];
    }

    function generateUniqueReview() {
      const catData = (combinatorialData[activeLang] && combinatorialData[activeLang][activeCategory]) 
                      ? combinatorialData[activeLang][activeCategory] 
                      : combinatorialData[activeLang]['all'];

      let newReview = "";
      let attempts = 0;

      do {
        const p1 = getCryptoRandomItem(catData.openers);
        const p2 = getCryptoRandomItem(catData.details);
        const p3 = getCryptoRandomItem(catData.experience);
        const p4 = getCryptoRandomItem(catData.closers);
        newReview = `${p1} ${p2} ${p3} ${p4}`;
        attempts++;
      } while (recentReviews.includes(newReview) && attempts < 12);

      recentReviews.push(newReview);
      if (recentReviews.length > 6) recentReviews.shift();

      return newReview;
    }

    function updateReviewText() {
      document.getElementById('review-content').innerText = generateUniqueReview();
    }

    function setCategory(el, cat) {
      activeCategory = cat;
      document.querySelectorAll('.pill').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      updateReviewText();
    }

    function setLang(lang) {
      activeLang = lang;
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-hi').classList.toggle('active', lang === 'hi');
      updateReviewText();
    }

    function shuffleReview() {
      updateReviewText();
    }

    function copyAndRedirect() {
      const textToCopy = document.getElementById('review-content').innerText.trim();
      const btn = document.getElementById('copy-btn');

      btn.classList.add('copied');
      btn.innerHTML = "<span>✓</span> OPENING GOOGLE...";

      const doRedirect = () => {
        window.location.href = reviewRedirectUrl;
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          setTimeout(doRedirect, 250);
        }).catch(doRedirect);
      } else {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = textToCopy;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        setTimeout(doRedirect, 250);
      }
    }

    updateReviewText();
  </script>
