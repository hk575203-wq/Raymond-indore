<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>The Raymond Shop | TI Mall Indore</title>
  <style>
    :root {
      --bg-dark: #080608;
      --card-bg: #120d10;
      --raymond-red: #a8131a;
      --raymond-red-dark: #66080d;
      --gold-primary: #d4af37;
      --gold-light: #fef08a;
      --gold-grad: linear-gradient(135deg, #fef08a 0%, #d4af37 50%, #996515 100%);
      --text-main: #ffffff;
      --text-soft: #ede8ea;
      --text-muted: #9c9196;
      --border-gold: rgba(212, 175, 55, 0.28);
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(168, 19, 26, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
      overflow-x: hidden;
    }

    .app-wrapper {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      min-height: 100dvh;
      background: rgba(15, 11, 13, 0.95);
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    /* Minimalist Royal Header */
    .brand-header {
      padding: 24px 20px 12px;
      text-align: center;
    }

    .vintage-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--gold-primary);
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .brand-title {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 4px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }

    .location-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1b1316;
      border: 1px solid var(--border-gold);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      margin-top: 10px;
    }

    .stars-icon {
      color: #f59e0b;
      font-size: 13px;
      letter-spacing: 2px;
    }

    /* 3 Step Instruction Strip */
    .guide-strip {
      display: flex;
      justify-content: space-between;
      margin: 6px 16px 12px;
      background: #0d090b;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    .guide-step {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .step-num {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--gold-grad);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 900;
    }

    /* Main Area */
    .content-box {
      flex: 1;
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
    }

    /* Category Buttons */
    .pill-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .pill-scroll::-webkit-scrollbar { display: none; }

    .category-btn {
      background: #191215;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #a3989e;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }

    .category-btn:active {
      transform: scale(0.96);
    }

    .category-btn.active {
      background: linear-gradient(135deg, #a8131a 0%, #6e080e 100%);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(168, 19, 26, 0.4);
    }

    /* Sub Toolbar */
    .sub-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 4px 8px;
    }

    .status-badge {
      font-size: 11px;
      color: var(--gold-primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-green {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .lang-switcher {
      display: flex;
      background: #0d080a;
      padding: 2.5px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .lang-opt {
      background: transparent;
      border: none;
      color: #7d7277;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
    }

    .lang-opt.active {
      background: #25171b;
      color: #ffffff;
    }

    /* Review Display Box */
    .review-card {
      background: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 18px;
      padding: 18px 18px 14px;
      min-height: 105px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .review-card:active {
      background: #181215;
    }

    .review-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-soft);
      font-weight: 500;
      user-select: text;
    }

    .tap-hint {
      margin-top: 8px;
      font-size: 10.5px;
      color: #7e7379;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Big Thumb-Friendly Shuffle Button */
    .btn-next-review {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px dashed var(--border-gold);
      background: rgba(30, 20, 24, 0.6);
      color: var(--gold-light);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-next-review:active {
      background: var(--raymond-red);
      color: #ffffff;
      transform: scale(0.98);
      border-style: solid;
    }

    /* Main CTA Button */
    .cta-submit {
      margin-top: 14px;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: var(--gold-grad);
      color: #0b0708;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 24px rgba(212, 175, 55, 0.35);
      transition: transform 0.1s;
    }

    .cta-submit:active {
      transform: scale(0.97);
    }

    .cta-submit.copied {
      background: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.4);
    }

    /* Bottom Dock */
    .bottom-dock {
      margin-top: auto;
      background: #0b0709;
      border-top: 1px solid var(--border-subtle);
      padding: 12px 14px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .dock-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 700;
    }

    .dock-btn:active {
      color: var(--gold-light);
    }

    .dock-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #171013;
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
  </style>
</head>
<body>

      <!-- Primary Action Button -->
      <button class="cta-submit" id="copy-btn" onclick="handleCopyAndRedirect()">
        <span>📋</span> COPY & RATE 5-STAR
      </button>

    </main>

    <!-- Bottom Navigation Dock -->
    <footer class="bottom-dock">
      <a href="https://maps.app.goo.gl/cDBaZ3pP6Av1aEYo9" class="dock-btn" target="_blank">

        <div class="dock-icon">🌐</div>
        Website
      </a>

  </div>

    };

    let currentCategory = 'all';
    let currentLang = 'en';
    let previousReview = "";
    const redirectGoogleUrl = "https://maps.app.goo.gl/cDBaZ3pP6Av1aEYo9";

    // Instant Fast Random Picker (Zero Delay)
    function pickRandomReview() {
      const langItems = reviewPool[currentLang] || reviewPool['en'];
      const list = langItems[currentCategory] || langItems['all'];
      
      let candidate = "";
      let attempts = 0;
      do {
        const randomIndex = Math.floor(Math.random() * list.length);
        candidate = list[randomIndex];
        attempts++;
      } while (candidate === previousReview && list.length > 1 && attempts < 8);

      previousReview = candidate;
      return candidate;
    }

    function renderReview() {
      const box = document.getElementById('review-content');
      if (box) {
        box.innerText = pickRandomReview();
      }
    }

    function switchCategory(btn, cat) {
      currentCategory = cat;
      const allBtns = document.querySelectorAll('.category-btn');
      allBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderReview();
    }

    function switchLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-hi').classList.toggle('active', lang === 'hi');
      renderReview();
    }
